<style>
:root{
  --felt:#17424a; --felt-hi:#22606a; --felt-edge:#0d2a2f;
  --ink:#eef2ec; --ink-dim:#a6c0bb; --brass:#e4b24f; --brass-ink:#2a1f05;
  --card:#fbf7ee; --card-edge:#d6cdb9; --red:#c2262b; --black:#1c2226;
  --panel:#fbf7ee; --panel-ink:#1c2226; --panel-dim:#5b6866; --line:rgba(28,34,38,.14); --chip:#ece5d4;
  --good:#2f7d4f; --bad:#b3362f;
  --serif:'Alegreya', Georgia, 'Times New Roman', serif;
  --sans:'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#1f383d; --panel-ink:#eef2ec; --panel-dim:#a6c0bb; --line:rgba(238,242,236,.16); --chip:#2b4a50; }
}
:root[data-theme="dark"]{ --panel:#1f383d; --panel-ink:#eef2ec; --panel-dim:#a6c0bb; --line:rgba(238,242,236,.16); --chip:#2b4a50; }
*,*::before,*::after{box-sizing:inherit}
html{font-size:112.5%;height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--felt-edge)}

  background:radial-gradient(ellipse 120% 80% at 50% 45%, var(--felt-hi) 0%, var(--felt) 55%, var(--felt-edge) 100%);
  overflow:hidden;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

/* barre de score */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 12px 4px}
.scores{display:flex;flex-direction:column;gap:3px;justify-self:start}
#menuBtn{justify-self:end}
.score{display:flex;align-items:baseline;gap:8px;line-height:1.05}
.score .lbl{min-width:2.9em}
.score .lbl{font-size:.8rem;color:var(--ink-dim)}
.score b{font-family:var(--serif);font-weight:800;font-size:1.3rem;letter-spacing:.01em}
.contract{text-align:center;min-width:130px;line-height:1.15;padding:4px 14px 5px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid rgba(228,178,79,.35)}
.contract:empty{display:none}
.contract .c-main{font-family:var(--serif);font-weight:800;font-size:1.45rem;color:var(--brass);display:flex;align-items:center;justify-content:center;gap:6px}
.contract .c-main .x{font-family:var(--sans);font-size:.75rem;font-weight:700;background:var(--bad);color:#fff;border-radius:6px;padding:1px 6px}
.contract .c-sub{color:var(--ink);font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px}
.team{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em}
.team.us{background:var(--brass);color:var(--brass-ink)}
.team.them{background:rgba(255,255,255,.18);color:var(--ink)}
.marks{display:flex;align-items:center;gap:4px;min-height:22px}
.dtok{width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--black);font-family:var(--serif);font-weight:800;font-size:.75rem;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4);flex:none}
.ctag{font-family:var(--serif);font-weight:800;font-size:.85rem;background:var(--brass);color:var(--brass-ink);border-radius:7px;padding:0 6px;white-space:nowrap}
.seat.seat-0{flex-direction:row;justify-content:center;gap:8px}
.iconbtn{background:none;border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}

/* table */
.table{flex:1;min-height:0;display:grid;grid-template-columns:72px 1fr 72px;grid-template-rows:auto 1fr auto;
  grid-template-areas:". n ." "w c e" ". s .";padding:2px 6px;position:relative}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:.95rem}
.seat-2{grid-area:n}.seat-3{grid-area:e;justify-content:center}.seat-1{grid-area:w;justify-content:center}.seat-0{grid-area:s;min-height:30px}
.ccw .seat-3{grid-area:w}.ccw .seat-1{grid-area:e}
.name{display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:12px;white-space:nowrap;transition:background .2s,color .2s}
.table{grid-template-columns:78px 1fr 78px}
.seat.active .name{background:var(--brass);color:var(--brass-ink)}
.seat.active .name .dealer{background:rgba(0,0,0,.12)}
.team-us{color:var(--ink)} 
.backs{display:flex;height:26px}
.backs i{width:16px;height:24px;border-radius:3px;margin-left:-9px;border:1px solid rgba(255,255,255,.35);
  background:repeating-linear-gradient(45deg,#8a2d2f 0 3px,#a8393b 3px 6px)}
.backs i:first-child{margin-left:0}
.seat-1 .backs,.seat-3 .backs{flex-direction:column;height:auto;width:26px;align-items:center}
.seat-1 .backs i,.seat-3 .backs i{width:24px;height:16px;margin-left:0;margin-top:-10px}
.seat-1 .backs i:first-child,.seat-3 .backs i:first-child{margin-top:0}
.bubble{position:absolute;z-index:5;background:var(--card);color:var(--black);font-family:var(--serif);font-weight:700;
  padding:3px 9px;border-radius:10px;font-size:.95rem;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3);animation:pop .25s ease-out}
.bubble small{font-family:var(--sans);font-weight:500;font-size:.72rem;color:#5b6866;display:block;line-height:1.1}
.seat-2 .bubble{top:26px;left:calc(50% + 46px)}
.seat-0 .bubble{bottom:100%;margin-bottom:4px}
.seat-1 .bubble{left:6px;bottom:calc(50% + 64px)}
.seat-3 .bubble{right:6px;bottom:calc(50% + 64px)}
.ccw .seat-1 .bubble{left:auto;right:6px}.ccw .seat-3 .bubble{right:auto;left:6px}
.bubble.strong{background:var(--brass);color:var(--brass-ink)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* centre */
.center{grid-area:c;position:relative;min-height:180px}
.slot{position:absolute;left:50%;top:50%}
.slot .card{transition:transform .35s ease, opacity .35s ease}
.slot.p0{transform:translate(-50%,2%)}
.slot.p2{transform:translate(-50%,-102%)}
.slot.p3{transform:translate(38%,-50%) rotate(7deg)}
.slot.p1{transform:translate(-138%,-50%) rotate(-7deg)}
.ccw .slot.p1{transform:translate(38%,-50%) rotate(7deg)}
.ccw .slot.p3{transform:translate(-138%,-50%) rotate(-7deg)}
.slot.win .card{box-shadow:0 0 0 3px var(--brass),0 6px 14px rgba(0,0,0,.35)}
.center.gather .slot.win{z-index:2}
.center.gather .slot{transition:transform .3s cubic-bezier(.3,.7,.4,1);transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.center.gather .slot.p1{--rot:4deg}.center.gather .slot.p3{--rot:-5deg}.center.gather .slot.p2{--rot:2deg}
.center.away .slot{transition:transform .42s cubic-bezier(.5,0,.8,.4),opacity .32s ease .12s;opacity:0}
.center.away.to-0 .slot{transform:translate(-50%,150%) scale(.55)}
.center.away.to-2 .slot{transform:translate(-50%,-250%) scale(.55)}
.center.away.to-3 .slot{transform:translate(170%,-50%) scale(.55)}
.center.away.to-1 .slot{transform:translate(-270%,-50%) scale(.55)}
.ccw .center.away.to-1 .slot{transform:translate(170%,-50%) scale(.55)}
.ccw .center.away.to-3 .slot{transform:translate(-270%,-50%) scale(.55)}
.enter-0{animation:in0 .28s ease-out}.enter-1{animation:in1 .28s ease-out}.enter-2{animation:in2 .28s ease-out}.enter-3{animation:in3 .28s ease-out}
@keyframes in0{from{transform:translateY(90px);opacity:.3}}
@keyframes in1{from{transform:translateX(-90px);opacity:.3}}
.ccw .enter-1{animation-name:in3}.ccw .enter-3{animation-name:in1}
@keyframes in2{from{transform:translateY(-90px);opacity:.3}}
@keyframes in3{from{transform:translateX(90px);opacity:.3}}
.log{position:absolute;inset:6px 4px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:3px;font-size:.95rem;color:var(--ink-dim);text-align:center}
.bidlog{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:4px 14px;min-width:min(210px,100%);display:flex;flex-direction:column}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:3px 0;font-size:1rem;border-bottom:1px solid rgba(255,255,255,.08)}
.brow:last-child{border-bottom:0}
.brow .who{color:var(--ink-dim);display:flex;align-items:center;gap:7px;white-space:nowrap}
.brow .who::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);flex:none}
.brow.us .who::before{background:var(--brass)}
.brow .what{font-family:var(--serif);font-weight:800;font-size:1.2rem;color:var(--ink);white-space:nowrap}
.brow.pass .what{font-family:var(--sans);font-weight:500;font-size:.95rem;color:var(--ink-dim)}
.brow.co .what{color:#ff8379}
.brow.last .who{color:var(--ink)}
.rs{color:var(--red)}
.contract .rs,.bidlog .rs{color:#ff8379}
.log .row{display:flex;gap:6px}
.log .row b{color:var(--ink);font-family:var(--serif)}
.log .status{margin-top:8px;color:var(--ink);font-size:1.02rem}
.log .tap{display:inline-block;margin-top:6px;padding:7px 16px;border-radius:999px;background:var(--brass);color:var(--brass-ink);font-weight:700;white-space:nowrap;animation:tapPulse 1.6s ease-in-out infinite}
@keyframes tapPulse{50%{transform:scale(1.06)}}

/* cartes */
.card{--w:58px;width:var(--w);height:calc(var(--w)*1.45);background:var(--card);border-radius:calc(var(--w)*.1);
  border:1px solid var(--card-edge);box-shadow:0 2px 5px rgba(0,0,0,.28);position:relative;color:var(--black);font-family:var(--serif);flex:none}
.card.red{color:var(--red)}
.card .ix{position:absolute;left:calc(var(--w)*.08);top:calc(var(--w)*.05);display:flex;flex-direction:column;align-items:center;line-height:.95}
.card .ix .r{font-weight:800;font-size:calc(var(--w)*.33);letter-spacing:-.04em}
.card .ix .s{font-size:calc(var(--w)*.26)}
.card .pip{position:absolute;right:calc(var(--w)*.1);bottom:calc(var(--w)*.08);font-size:calc(var(--w)*.62);line-height:1}
.card.trump::after{content:"";position:absolute;inset:3px;border-radius:calc(var(--w)*.08);border:1.5px solid rgba(228,178,79,.85);pointer-events:none}

/* main */
.hand{display:flex;justify-content:center;padding:6px 8px 10px;min-height:100px;align-items:flex-end}
.hand .card{transition:transform .24s cubic-bezier(.25,.8,.3,1), filter .3s ease}
.hand button.card{padding:0;text-align:left}
.hand .card.off{filter:brightness(.6) saturate(.5);transform:translateY(10px)}
.hand .card.on{transform:translateY(-6px)}
.hand .card.on:active{transform:translateY(-14px)}
.hand .card.hint{box-shadow:0 0 0 3px var(--brass),0 6px 14px rgba(0,0,0,.4);transform:translateY(-14px)}

/* bandeau d'actions */
.actions{position:relative;padding:0 10px;height:4.4rem;display:flex;flex-direction:column;justify-content:flex-end}
.tools{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:.95rem;color:var(--ink-dim);padding-bottom:2px}
.tools .btn{min-width:6.2rem;text-align:center}
.tools .left{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.tools .live{display:flex;flex-direction:column;line-height:1.2}
.tools .live .t{font-size:.8rem}
.tools .live b{color:var(--ink);font-family:var(--serif);font-size:1.1rem}
.names{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin:8px 0 2px}
.names label{color:var(--panel-dim);font-size:.92rem}
.names input{font:inherit;color:var(--panel-ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;width:100%;user-select:text;-webkit-user-select:text}
.names input:focus{outline:none;border-color:var(--brass)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;background:rgba(255,255,255,.12);color:var(--ink)}
.btn.primary{background:var(--brass);color:var(--brass-ink)}
.btn.danger{background:#a83a2f;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{padding:6px 11px;font-size:.88rem;font-weight:500}

/* panneau d'enchères */
.bidpanel{position:absolute;left:10px;right:10px;bottom:0;z-index:8;background:var(--panel);color:var(--panel-ink);border-radius:16px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;animation:rise .22s ease-out}
.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.modes button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px 0;font-family:var(--serif);font-weight:800;font-size:1.15rem;color:var(--panel-ink)}
.modes button.red{color:var(--red)}
.modes button.txt{font-size:.85rem}
.modes button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.levels{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.levels::-webkit-scrollbar{display:none}
.levels button{flex:none;border:0;background:var(--chip);color:var(--panel-ink);border-radius:9px;padding:7px 11px;font-family:var(--serif);font-weight:700;font-size:1rem}
.levels button[aria-pressed="true"]{background:var(--panel-ink);color:var(--panel)}
.bidrow{display:flex;gap:6px}
.bidrow .btn{flex:1;height:58px;padding:4px 8px;line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center}
.bidpanel .btn{background:var(--chip);color:var(--panel-ink)}
.bidpanel .btn.primary{background:var(--brass);color:var(--brass-ink)}
.bidpanel .btn.danger{background:#a83a2f;color:#fff}
.advice{height:2.2rem;display:flex;align-items:center;font-size:.9rem;color:var(--panel-dim);overflow:hidden}
.advice .adv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.advice .btn.small{height:2.2rem;padding:0 12px}
.advice b{color:var(--panel-ink)}

/* surcouches */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,20,23,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
.overlay[hidden]{display:none}
.overlay.mid{align-items:center}
.final{text-align:center;padding:6px 2px 0}
.final .medal{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:46px;line-height:1;background:var(--brass);color:var(--brass-ink);box-shadow:0 0 0 6px rgba(228,178,79,.25),0 8px 20px rgba(0,0,0,.25);animation:medal .7s cubic-bezier(.2,1.4,.4,1)}
.final.lose .medal{background:var(--chip);color:var(--panel-dim);box-shadow:0 0 0 6px var(--line)}
@keyframes medal{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.final h2{font-size:2.2rem;margin:4px 0 2px}
.final.win h2{color:var(--brass)}
.final .who{color:var(--panel-dim);margin:0 0 14px}
.finalscore{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:6px 0 16px}
.finalscore div{display:flex;flex-direction:column;align-items:center}
.finalscore span{font-size:.85rem;color:var(--panel-dim)}
.finalscore b{font-family:var(--serif);font-weight:800;font-size:2.4rem;line-height:1}
.finalscore .dash{font-size:1.6rem;color:var(--panel-dim);padding-bottom:4px}
.finalscore .best b{color:var(--brass)}
.final.lose .finalscore .best b{color:var(--panel-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
.stats div{background:var(--chip);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-family:var(--serif);font-size:1.3rem}
.stats span{font-size:.75rem;color:var(--panel-dim);line-height:1.15;display:block}
.log .fresh{font-family:var(--serif);font-weight:800;font-size:1.6rem;color:var(--brass);animation:pop .5s ease-out;margin-bottom:4px}
#confetti{position:fixed;inset:0;z-index:30;pointer-events:none}
.sheet{background:var(--panel);color:var(--panel-ink);width:100%;max-width:520px;border-radius:20px;padding:18px 18px 16px;max-height:100%;overflow:auto;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-family:var(--serif);font-weight:800;font-size:1.5rem;margin:0 0 4px}
.sheet h3{font-family:var(--serif);font-size:1.1rem;margin:16px 0 4px}
.sheet p{margin:6px 0;line-height:1.45;color:var(--panel-ink)}
.sheet .muted{color:var(--panel-dim);font-size:.92rem}
.sheet table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.98rem}
.sheet th,.sheet td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.sheet th:first-child,.sheet td:first-child{text-align:left;color:var(--panel-dim);font-weight:500}
.sheet td b{font-family:var(--serif);font-size:1.15rem}
.verdict{display:inline-block;padding:2px 10px;border-radius:8px;font-weight:700;color:#fff;font-size:.9rem;vertical-align:middle;margin-left:6px}
.verdict.ok{background:var(--good)}.verdict.ko{background:var(--bad)}
.sheet .btn{background:var(--chip);color:var(--panel-ink)}
.sheet .btn.primary{background:var(--brass);color:var(--brass-ink)}
.sheet .actions-row{display:flex;gap:8px;margin-top:14px}
.sheet .actions-row{flex-wrap:wrap}
.sheet .actions-row .btn{flex:1 1 auto;padding:12px 10px}
.seg{display:flex;gap:6px;margin:6px 0 2px}
.seg button{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--panel-ink);border-radius:10px;padding:8px 4px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--panel-ink);color:var(--panel);border-color:var(--panel-ink)}
.lasttrick{display:flex;gap:6px;justify-content:center;margin:12px 0}
.lasttrick figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--panel-dim)}
.lasttrick figure.w .card{box-shadow:0 0 0 3px var(--brass)}
.rules p,.rules li{font-size:.95rem;line-height:1.45}
.rules ul{padding-left:18px;margin:4px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-height:760px){.card{--w:64px}}
</style>

<body>
<div id="app">
  <header class="bar">
    <div class="scores"><div class="score us"><span class="lbl">Nous</span><b id="sUs">0</b></div>
    <div class="score them"><span class="lbl">Eux</span><b id="sThem">0</b></div></div>
    <div class="contract" id="contract"></div>
    <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main class="table" id="table">
    <div class="seat seat-2" id="seat2"></div>
    <div class="seat seat-3" id="seat3"></div>
    <div class="center" id="center"></div>
    <div class="seat seat-1" id="seat1"></div>
    <div class="seat seat-0" id="seat0"></div>
  </main>
  <section class="actions" id="actions"></section>
  <div class="hand" id="hand"></div>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
// ===== Moteur de coinche =====
const E = (function () {
  const SUITS = ['♠', '♥', '♦', '♣'];
  const SUIT_NAMES = ['Pique', 'Cœur', 'Carreau', 'Trèfle'];
  const RANKS = ['7', '8', '9', '10', 'V', 'D', 'R', 'A'];
  const MODE_SHORT = ['♠', '♥', '♦', '♣', 'TA', 'SA'];
  const MODE_NAMES = ['Pique', 'Cœur', 'Carreau', 'Trèfle', 'Tout atout', 'Sans atout'];
  const S = c => c >> 3, R = c => c & 7;
  // rangs : 0=7 1=8 2=9 3=10 4=V 5=D 6=R 7=A
  const TR_STR = [1, 2, 7, 5, 8, 3, 4, 6], PL_STR = [1, 2, 3, 7, 4, 5, 6, 8];
  const P_TR = [0, 0, 14, 10, 20, 3, 4, 11], P_PL = [0, 0, 0, 10, 2, 3, 4, 11];
  const P_TA = [0, 0, 9, 5, 14, 1, 3, 6], P_SA = [0, 0, 0, 10, 2, 3, 4, 19];
  const CAPOT = 250;

  const trumpOrder = (c, m) => m === 4 || (m < 4 && S(c) === m);
  const str = (c, m) => trumpOrder(c, m) ? TR_STR[R(c)] : PL_STR[R(c)];
  const pts = (c, m) => { const r = R(c); if (m < 4) return S(c) === m ? P_TR[r] : P_PL[r]; return m === 4 ? P_TA[r] : P_SA[r]; };
  const isTrump = (c, m) => m < 4 && S(c) === m;

  function beats(a, b, m) {
    const at = isTrump(a, m), bt = isTrump(b, m);
    if (at !== bt) return at;
    if (S(a) !== S(b)) return false;
    return str(a, m) > str(b, m);
  }
  function winnerIdx(cards, m) { let w = 0; for (let i = 1; i < cards.length; i++) if (beats(cards[i], cards[w], m)) w = i; return w; }

  function legal(hand, tc, leader, m, p) {
    if (!tc.length) return hand.slice();
    const led = S(tc[0]);
    const follow = hand.filter(c => S(c) === led);
    const wi = winnerIdx(tc, m), wc = tc[wi];
    if (follow.length) {
      if ((m === 4 || (m < 4 && led === m)) && S(wc) === led) {
        const up = follow.filter(c => str(c, m) > str(wc, m));
        if (up.length) return up;
      }
      return follow;
    }
    if (m >= 4) return hand.slice();
    const tr = hand.filter(c => S(c) === m);
    if (!tr.length) return hand.slice();
    const wp = (leader + wi) % 4;
    if (wp === (p + 2) % 4) return hand.slice(); // partenaire maître : pas d'obligation
    if (isTrump(wc, m)) {
      const up = tr.filter(c => str(c, m) > str(wc, m));
      return up.length ? up : tr; // surcouper si possible, sinon sous-couper
    }
    return tr;
  }

  // ---------- Évaluation d'une main (valeur "propre" en points de contrat) ----------
  function bySuit(hand) { const b = [[], [], [], []]; for (const c of hand) b[S(c)].push(R(c)); return b; }
  function valColor(hand, T) {
    const by = bySuit(hand), tr = by[T], n = tr.length, h = r => tr.includes(r);
    let v = 0;
    if (h(4)) v += n === 1 ? 12 : 20;
    if (h(2)) v += h(4) ? 15 : (n >= 3 ? 12 : (n === 2 ? 8 : 4));
    if (h(7)) v += n >= 2 ? 10 : 7;
    if (h(3)) v += (h(7) || n >= 3) ? 6 : 3;

  // ---------- Paramètres du modèle d'enchères (calibrés par simulation) ----------

  // ---------- Lecture des enchères (ce que chaque joueur a "montré") ----------

  // ---------- Infos publiques tirées des plis ----------
  function derive(round) {
    const m = round.contract.mode;

    const all = round.tricks.concat(round.cur.cards.length ? [round.cur] : []);
    for (const t of all) {

  // ---------- Tirage d'une donne compatible avec ce que sait le joueur "me" ----------
  function sampleHands(me, myHand, counts, unknown, m, info, bidInfo, tries) {
    const { voids, cap, played, forced } = info;

    function assign(relax) {
      const hands = [[], [], [], []]; hands[me] = myHand.slice();

        else cards.push(c);
      }

  // ---------- Simulation rapide (monde à information complète) ----------
  function newWorld(hands, leader, m, takerTeam, level, pts0, tricks0, beloteP) {

  }
  function cloneW(W) { return { hands: W.hands.map(h => h.slice()), tc: W.tc.slice(), leader: W.leader, m: W.m, takerTeam: W.takerTeam, level: W.level, pts: W.pts.slice(), tricks: W.tricks.slice(), n: W.n, beloteP: W.beloteP }; }

  function rollout(W) { while (W.n < 8) { const p = wTurn(W); wPlay(W, p, policy(W, p)); } return W; }

  // ---------- Choix d'une carte (Monte Carlo à information imparfaite) ----------
  function now() { return (typeof performance !== 'undefined' ? performance : Date).now(); }
  function chooseCard(G, me, opts) {
    opts = opts || {};
    const round = G.round, m = round.contract.mode, hand = round.hands[me];
    const L = legal(hand, round.cur.cards, round.cur.leader, m, me);
    if (L.length === 1) return { card: L[0], scores: null };
    const info = derive(round);

    const counts = round.hands.map(h => h.length);
    const known = new Set(hand); info.played.forEach(a => a.forEach(c => known.add(c)));

  // ---------- Simulation d'une donne complète depuis l'enchère ----------
  function simContract(myHand, me, dealer, bids, contract, N) {
    const bi = analyzeBids(bids, dealer);
    const known = new Set(myHand); const unknown = []; for (let c = 0; c < 32; c++) if (!known.has(c)) unknown.push(c);
    const info = { voids: [0, 1, 2, 3].map(() => [0, 0, 0, 0]), cap: [0, 1, 2, 3].map(() => [99, 99, 99, 99]), played: [[], [], [], []], forced: {} };
    let ok = 0, capot = 0, ptsSum = 0, n = 0;

      if (!hands) continue;
      let bp = -1; if (m < 4) for (let q = 0; q < 4; q++) if (hands[q].includes(m * 8 + 6) && hands[q].includes(m * 8 + 5)) bp = q;

  // ---------- IA d'enchères ----------
  function currentHigh(bids) {
    let H = null;
    for (const b of bids) {

    }

  }
  function allowedActions(bids, p) {
    const H = currentHigh(bids);

    if (H && H.level === CAPOT) a.bid = false;
    if (H && H.level >= 160) a.minLevel = CAPOT;
    if (H && H.coinche > 1) a.bid = false;
    if (H && H.coinche === 1 && H.team !== (p & 1)) a.coinche = true;
    if (H && H.coinche === 2 && H.team === (p & 1)) a.surcoinche = true;

      const idx = bids.findIndex(b => b.type === 'coinche');

    return q;

  function aiBid(G, p) {
    const round = G.round, bids = round.bids, hand = round.hands[p];
    const A = allowedActions(bids, p), H = currentHigh(bids);
    const flair = round.flair[p];
    const partner = (p + 2) % 4, team = p & 1;

    ${canBid?`<div class="modes" role="group" aria-label="Atout" style="grid-template-columns:repeat(${modeList.length},1fr)">${ms}</div><div class="levels" role="group" aria-label="Niveau">${lv}</div>`:''}
    <div class="bidrow"><button class="btn" id="passBtn">Passer</button>
    ${canBid?`<button class="btn primary" id="bidBtn" ${UI.sel.mode==null?'disabled':''}>${label}</button>`:''}
    ${A.coinche?'<button class="btn danger" id="coBtn">Coincher</button>':''}
    ${A.surcoinche?'<button class="btn danger" id="scoBtn">Surcoincher</button>':''}</div>
    <div class="advice" id="advice">${UI.advice||'<button class="btn small" id="advBtn">Conseil</button>'}</div></div>`;
}
function bindBid(){
  document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{UI.sel.mode=+b.dataset.m;rerenderBid()});
  document.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{UI.sel.level=+b.dataset.l;rerenderBid()});
  $('passBtn').onclick=()=>humanBid({type:'pass'});
  const bb=$('bidBtn');if(bb)bb.onclick=()=>humanBid({type:'bid',level:UI.sel.level,mode:UI.sel.mode});
  const co=$('coBtn');if(co)co.onclick=()=>humanBid({type:'coinche'});
  const sco=$('scoBtn');if(sco)sco.onclick=()=>humanBid({type:'surcoinche'});
  const ab=$('advBtn');if(ab)ab.onclick=()=>{ab.textContent='…';setTimeout(()=>{
    const save=G.round.flair[0];G.round.flair[0]=0;const a=E.aiBid(G,0);G.round.flair[0]=save;
    UI.advice=`<span class="adv">Conseil : <b>${bidText(a)}</b>${a.why?` (${a.why})`:''}</span>`;
    if(a.type==='bid'){UI.sel.mode=a.mode;UI.sel.level=a.level}
    renderActions()},30)};
}
function rerenderBid(){const lv=document.querySelector('.levels');const x=lv?lv.scrollLeft:0;renderActions();const lv2=document.querySelector('.levels');if(lv2)lv2.scrollLeft=x}
function humanBid(a){UI.advice='';doBid(0,a)}

/* ---------- déroulé ---------- */
function clearBubbles(){UI.bubbles=[null,null,null,null]}
function collectTrick(w,done){
  const c=$('center');
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){done();return}
  c.classList.add('gather');
  UI.timer=setTimeout(()=>{c.classList.add('away','to-'+w);
    UI.timer=setTimeout(()=>{c.classList.remove('gather','away','to-0','to-1','to-2','to-3');done()},460)},UI.speed==='rapide'?240:340);
}
function animateDeal(){
  const R=G.round;if(reduced()||!document.body.animate)return 0;
  const k=UI.speed==='rapide'?0.6:1,T=95*k,D=380*k;
  const ds=$('seat'+R.dealer).getBoundingClientRect(),dcx=ds.left+ds.width/2,dcy=ds.top+ds.height/2;
  const slot=(q,j)=>{const ord=(q-R.dealer+3)%4,r=j<3?0:j<5?1:2;return (r*4+ord)*T+(j-[0,3,5][r])*T/3};
  let end=0;
  const go=(elm,q,j)=>{const r=elm.getBoundingClientRect(),dx=dcx-(r.left+r.width/2),dy=dcy-(r.top+r.height/2),t=slot(q,j);end=Math.max(end,t+D);
    elm.animate([{transform:`translate(${dx}px,${dy}px) rotate(${(j%2?1:-1)*14}deg) scale(.55)`,opacity:0,offset:0},{opacity:1,offset:.25},{transform:'translate(0px,0px) rotate(0deg) scale(1)',opacity:1}],{duration:D,delay:t,easing:'cubic-bezier(.2,.7,.3,1)',fill:'backwards'})};
  $('hand').querySelectorAll('button.card').forEach((b,j)=>go(b,0,j));
  for(const q of [1,2,3])$('seat'+q).querySelectorAll('.backs i').forEach((b,j)=>go(b,q,j));
  return end;
}
function step(){
  clearTimeout(UI.timer);
  if(!G){return}
  const R=G.round;
  if(!R){E.startRound(G);clearBubbles();UI.sel={mode:null,level:null};UI.advice='';UI.dealing=true;save();}
  render();
  if(UI.dealing){const t=animateDeal();UI.timer=setTimeout(()=>{UI.dealing=false;UI.freshGame=false;step()},t+d(UI.freshGame?900:300));return}
  const r=G.round;
  if(UI.showTrick)return;
  if(UI.awaitTap)return;
  if(r.phase==='bidding'){
    if(r.turn===0)return;
    UI.timer=setTimeout(()=>{const p=r.turn;const a=E.aiBid(G,p);doBid(p,a)},d(750));
  }else if(r.phase==='redeal'){
    UI.timer=setTimeout(()=>{G.round=null;step()},d(1700));
  }else if(r.phase==='play'){
    if(r.turn===0)return;
    UI.timer=setTimeout(()=>{const p=r.turn;const t0=performance.now();
      const res=E.chooseCard(G,p,{timeMs:UI.speed==='rapide'?220:380,minN:40,maxN:500});
      const wait=Math.max(0,d(600)-(performance.now()-t0));
      UI.timer=setTimeout(()=>doCard(p,res.card),wait)},40);
  }else if(r.phase==='scored'){showSummary()}
}
function doBid(p,a){
  const R=G.round;
  const st=E.applyBid(G,p,a);
  UI.bubbles[p]={text:bidHTML(a),why:a.why,strong:a.type==='coinche'||a.type==='surcoinche'};
  save();
  if(st==='play'||st==='redeal'){UI.awaitTap=true;UI.awaitSince=performance.now();render();return}
  step();
}
function doCard(p,c){
  const R=G.round;const before={leader:R.cur.leader,cards:R.cur.cards.slice()};
  if(p===0){const hb=$('hand').querySelector(`[data-c="${c}"]`);if(hb)UI.fly={c,rect:hb.getBoundingClientRect()}}
  const res=E.applyCard(G,p,c);UI.hint=null;UI.enter=c;
  if(res.belote)UI.bubbles[p]={text:res.belote,strong:true};
  save();
  if(res.trickDone){UI.showTrick={leader:before.leader,cards:before.cards.concat([c]),winner:res.trickDone.winner};render();
    UI.timer=setTimeout(()=>collectTrick(res.trickDone.winner,()=>{UI.showTrick=null;clearBubbles();step()}),d(1000));return}
  step();
}
$('hand').addEventListener('click',e=>{const b=e.target.closest('button.card');if(!b||b.disabled)return;
  const R=G.round;if(R.phase!=='play'||R.turn!==0||UI.showTrick)return;doCard(0,+b.dataset.c)});

/* ---------- surcouches ---------- */
function openSheet(html,mid){const o=$('overlay');o.classList.toggle('mid',!!mid);o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;o.hidden=false;return o}
function closeSheet(){$('overlay').hidden=true;$('overlay').innerHTML=''}
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&!$('overlay').dataset.lock)closeSheet()});
function showSummary(){
  const R=G.round,res=R.result,c=R.contract;const lv=c.level===E.CAPOT?'capot':c.level;
  const taker=c.team===0?'Nous':'Eux';
  const ok=res.made;
  if(!R.counted){R.counted=true;const st=getStats();st.hands++;putStats(st);save()}
  const o=openSheet(`<h2>${G.over?'Dernière donne':'Donne terminée'}</h2>
  <p>Contrat ${lv} ${modeHTML(c.mode)} ${c.coinche>1?(c.coinche===2?'coinché ':'surcoinché '):''}pris par ${c.p===0?'vous':esc(NAMES[c.p])}<span class="verdict ${ok?'ok':'ko'}">${ok?'Réussi':'Chuté'}</span></p>
  <table><tr><th></th><th>Nous</th><th>Eux</th></tr>
  <tr><td>Points des plis</td><td>${R.tricksWon[0]===8?'Capot':R.pts[0]}</td><td>${R.tricksWon[1]===8?'Capot':R.pts[1]}</td></tr>
  ${res.belote[0]||res.belote[1]?`<tr><td>Belote</td><td>${res.belote[0]||''}</td><td>${res.belote[1]||''}</td></tr>`:''}
  <tr><td>Marqué</td><td>+${res.add[0]}</td><td>+${res.add[1]}</td></tr>
  <tr><td>Total</td><td><b>${G.scores[0]}</b></td><td><b>${G.scores[1]}</b></td></tr></table>
  ${G.over?`<p class="muted">La partie est terminée : une équipe a dépassé ${G.target} points.</p>`:''}
  <div class="actions-row">${R.tricks.length?'<button class="btn" id="sumLast">Dernier pli</button>':''}<button class="btn primary" id="nextBtn">${G.over?'Voir le résultat':'Donne suivante'}</button></div>`);
  o.dataset.lock='1';
  const sl=$('sumLast');if(sl)sl.onclick=()=>{o.dataset.lock='';showLastTrick(true)};
  $('nextBtn').onclick=()=>{o.dataset.lock='';if(G.over){showGameOver();return}closeSheet();G.round=null;save();step()};
}
function showGameOver(){
  const win=G.scores[0]>G.scores[1];const H=G.history;
  if(!G.counted){G.counted=true;const st=getStats();if(win)st.wins++;else st.losses++;putStats(st);save()}
  const ours=H.filter(h=>h.contract.team===0),oursOk=ours.filter(h=>h.made).length;
  const coWon=H.filter(h=>h.contract.coinche>1&&((h.contract.team===0)===h.made)).length;
  const o=openSheet(`<div class="final ${win?'win':'lose'}"><div class="medal" aria-hidden="true">${win?'♠':'♣'}</div>
    <h2>${win?'Victoire !':'Défaite'}</h2>
    <p class="who">${win?`${esc(NAMES[2])} et vous remportez la partie.`:`${esc(NAMES[1])} et ${esc(NAMES[3])} l’emportent cette fois.`}</p>
    <div class="finalscore"><div class="${win?'best':''}"><span>Nous</span><b>${G.scores[0]}</b></div><span class="dash">–</span><div class="${win?'':'best'}"><span>Eux</span><b>${G.scores[1]}</b></div></div>
    <div class="stats"><div><b>${H.length}</b><span>donnes jouées</span></div><div><b>${oursOk}/${ours.length}</b><span>de vos contrats réussis</span></div><div><b>${coWon}</b><span>coinches gagnées par vous</span></div></div>
    <div class="actions-row"><button class="btn primary" id="newGameBtn">Nouvelle partie</button></div></div>`,true);
  o.dataset.lock='1';
  if(win)confetti();
  $('newGameBtn').onclick=()=>{o.dataset.lock='';closeSheet();const c=$('confetti');if(c)c.remove();
    const t=G.target,nt=!!G.noTASA;G=E.newGame(t);G.noTASA=nt;UI.freshGame=true;save();step()};
}
function confetti(){
  if(reduced())return;const old=$('confetti');if(old)old.remove();
  const cv=document.createElement('canvas');cv.id='confetti';document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,Hh=innerHeight;cv.width=W*dpr;cv.height=Hh*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const cols=['#e4b24f','#c2262b','#fbf7ee','#22606a','#f0d58a'];
  const P=[...Array(150)].map(()=>({x:Math.random()*W,y:-20-Math.random()*Hh*0.6,vx:(Math.random()-.5)*1.6,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*0.25,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){const e=t-t0;x.clearRect(0,0,W,Hh);x.globalAlpha=e>3200?Math.max(0,1-(e-3200)/800):1;
    for(const p of P){p.x+=p.vx+Math.sin((e/400)+p.r)*0.6;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.3)));x.restore()}
    if(e<4000&&cv.isConnected)requestAnimationFrame(f);else cv.remove()})(t0);
}
function __unused(){
}
function showLastTrick(fromSummary){
  const R=G.round;const t=R.tricks[R.tricks.length-1];if(!t)return;
  const figs=t.cards.map((c,i)=>{const p=(t.leader+i)%4;return `<figure class="${p===t.winner?'w':''}">${cardHTML(c,{w:56})}<figcaption>${p===0?'Vous':esc(NAMES[p])}</figcaption></figure>`}).join('');
  const o=openSheet(`<h2>Dernier pli</h2><p class="muted">Remporté par ${t.winner===0?'vous':esc(NAMES[t.winner])} (${t.points} points). Entame de ${t.leader===0?'vous':esc(NAMES[t.leader])}.</p><div class="lasttrick">${figs}</div><div class="actions-row"><button class="btn primary" id="closeLT">Fermer</button></div>`);
  $('closeLT').onclick=()=>{closeSheet();if(fromSummary===true)showSummary()};
}
function showMenu(){
  const o=openSheet(`<h2>Partie</h2>
  <h3>Vitesse des adversaires</h3><div class="seg" id="spd"><button data-v="normal" aria-pressed="${UI.speed==='normal'}">Posée</button><button data-v="rapide" aria-pressed="${UI.speed==='rapide'}">Rapide</button></div>
  <h3>Raisonnement des joueurs</h3><div class="seg" id="why"><button data-v="0" aria-pressed="${!UI.why}">Masqué</button><button data-v="1" aria-pressed="${UI.why}">Affiché</button></div>
  <p class="muted">Affiche sous les annonces l’estimation de jeu qui a motivé l’enchère ou la coinche.</p>
  <h3>Sens du jeu</h3><div class="seg" id="dir"><button data-v="0" aria-pressed="${!UI.ccw}">Horaire</button><button data-v="1" aria-pressed="${UI.ccw}">Antihoraire</button></div>
  <h3>Tout atout et sans atout</h3><div class="seg" id="tasa"><button data-v="1" aria-pressed="${!G.noTASA}">Autorisés</button><button data-v="0" aria-pressed="${!!G.noTASA}">Interdits</button></div>
  <p class="muted">Interdits : on ne joue qu’à la couleur, pour vous comme pour les autres joueurs. Le changement s’applique dès la prochaine enchère.</p>
  <h3>Noms des joueurs</h3><div class="names">
    <label for="nm0">Vous</label><input id="nm0" maxlength="14" autocomplete="off" value="${esc(NAMES[0])}">
    <label for="nm2">Partenaire</label><input id="nm2" maxlength="14" autocomplete="off" value="${esc(NAMES[2])}">
    <label for="nm1">Adversaire après vous</label><input id="nm1" maxlength="14" autocomplete="off" value="${esc(NAMES[1])}">
    <label for="nm3">Adversaire avant vous</label><input id="nm3" maxlength="14" autocomplete="off" value="${esc(NAMES[3])}"></div>
  <h3>Nouvelle partie</h3><div class="seg" id="tgt">${[1000,1500,2000].map(t=>`<button data-v="${t}" aria-pressed="${G.target===t}">${t} pts</button>`).join('')}</div>
  <div class="actions-row"><button class="btn" id="rulesBtn">Règles</button><button class="btn" id="newBtn">Recommencer</button><button class="btn primary" id="closeM">Reprendre</button></div>
  ${(()=>{const s=getStats();return `<p class="muted" style="text-align:center;font-size:.75rem;opacity:.6;margin:14px 0 0">${s.hands} donne${s.hands>1?'s':''} · ${s.wins+s.losses} partie${s.wins+s.losses>1?'s':''} · ${s.wins} V – ${s.losses} D</p>`})()}`);
  let tgt=G.target;
  o.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>{UI.speed=b.dataset.v;save();showMenu()});
  o.querySelectorAll('#why button').forEach(b=>b.onclick=()=>{UI.why=b.dataset.v==='1';save();render();showMenu()});
  [0,1,2,3].forEach(i=>{const inp=$('nm'+i);inp.oninput=()=>{const v=inp.value.trim();NAMES[i]=v||DEFAULT_NAMES[i];save();render()}});
  o.querySelectorAll('#tasa button').forEach(b=>b.onclick=()=>{G.noTASA=b.dataset.v==='0';save();render();showMenu()});
  o.querySelectorAll('#dir button').forEach(b=>b.onclick=()=>{UI.ccw=b.dataset.v==='1';save();render();showMenu()});
  o.querySelectorAll('#tgt button').forEach(b=>b.onclick=()=>{tgt=+b.dataset.v;o.querySelectorAll('#tgt button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('newBtn').onclick=()=>{clearTimeout(UI.timer);UI.showTrick=null;const nt=!!G.noTASA;G=E.newGame(tgt);G.noTASA=nt;UI.freshGame=true;clearBubbles();save();closeSheet();step()};
  $('closeM').onclick=()=>{closeSheet();if(G.round&&G.round.phase==='scored')showSummary()};
  $('rulesBtn').onclick=showRules;
}
function showRules(){
  openSheet(`<div class="rules"><h2>Règles appliquées</h2>
  <h3>Enchères</h3><p>De 80 à 160 par paliers de 10, puis capot (tous les plis). Atout à une couleur, tout atout ou sans atout. Trois passes après une annonce ferment l’enchère ; quatre passes d’entrée et on redistribue. Un adversaire du preneur peut coincher (×2), puis l’équipe preneuse peut surcoincher (×4) ; une coinche ferme les enchères.</p>
  <h3>Jeu de la carte</h3><ul><li>Fournir obligatoirement à la couleur demandée.</li><li>À l’atout (et en tout atout), monter sur la meilleure carte si on le peut.</li><li>Sans la couleur : couper, surcouper si possible, sinon sous-couper. Libre si le partenaire est maître.</li><li>Belote-rebelote (roi et dame d’atout) : 20 points, annoncée automatiquement.</li></ul>
  <h3>Valeur des cartes</h3><p><b>Atout :</b> V 20, 9 14, A 11, 10 10, R 4, D 3<br><b>Hors atout :</b> A 11, 10 10, R 4, D 3, V 2<br><b>Tout atout :</b> V 14, 9 9, A 6, 10 5, R 3, D 1<br><b>Sans atout :</b> A 19, 10 10, R 4, D 3, V 2<br><b>Dix de der :</b> 10<br><b>Total :</b> 162</p>
  <h3>Marque</h3><p>Le preneur doit atteindre son contrat (belote comprise) et faire plus que la défense. Réussi : contrat + points faits pour le preneur, points faits pour la défense. Chuté : 160 + contrat pour la défense. Coinché ou surcoinché : le gagnant marque 160 + contrat ×2 ou ×4. La belote reste à l’équipe qui l’a.</p>
  <h3>Les adversaires</h3><p>Ils évaluent leur main dans chaque atout, lisent vos enchères et vos passes, et relancent leur partenaire selon ce qu’ils apportent (as, valet ou 9 d’atout, belote, coupes). Pour coincher, surcoincher ou tenter un capot, et pour chaque carte jouée, ils simulent des centaines de donnes cohérentes avec tout ce qui a été vu : couleurs manquantes, refus de monter, annonces. Chacun a son tempérament : ${esc(NAMES[1])} prend plus de risques, ${esc(NAMES[3])} en prend moins.</p></div>
  <div class="actions-row"><button class="btn primary" id="closeR">Fermer</button></div>`);
  $('closeR').onclick=showMenu;
}
$('menuBtn').onclick=showMenu;
function continueAfterTap(){UI.awaitTap=false;clearBubbles();if(G.round&&G.round.phase==='redeal')G.round=null;step()}
document.addEventListener('click',e=>{if(!UI.awaitTap||performance.now()-(UI.awaitSince||0)<400)return;if(e.target.closest('#menuBtn')||!$('overlay').hidden)return;continueAfterTap()});
window.addEventListener('resize',()=>{if(G)render()});

/* ---------- démarrage ---------- */
if(!load()){G=E.newGame(1000)}
if(G.round&&G.round.phase==='scored')render();
step();
})();
</script>
